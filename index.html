<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dithermaxxing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Dithermaxxxing</h1>
        <span class="badge">FREE</span>
      </div>

      <div class="dropzone" id="dropzone">
        <div>
          <strong>Drop an image</strong>
          <span>or select PNG, JPEG, GIF, BMP, or WebP from disk</span>
        </div>
        <input id="imageInput" type="file" accept="image/*" aria-label="Upload image">
      </div>

      <fieldset>
        <legend>Image</legend>
        <div class="control">
          <label for="fitMode">Fit mode</label>
          <select id="fitMode">
            <option value="contain">Contain</option>
            <option value="cover">Cover</option>
            <option value="original">Original</option>
          </select>
        </div>

        <div class="control">
          <label for="sizePreset">Format</label>
          <select id="sizePreset">
            <option value="custom">Custom</option>
            <option value="square">Square (1:1)</option>
            <option value="horizontal" selected>Horizontal (16:9)</option>
            <option value="vertical">Vertical (9:16)</option>
          </select>
        </div>

        <div class="control">
          <label for="outputSize">Size</label>
          <select id="outputSize">
            <option value="0">1280 x 720</option>
            <option value="1" selected>1920 x 1080</option>
            <option value="2">2560 x 1440</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="two-col" id="customDimensions" hidden>
          <div class="control">
            <label for="outputWidth">Output width</label>
            <input id="outputWidth" type="number" min="8" max="4096" step="1" value="1920">
          </div>
          <div class="control">
            <label for="outputHeight">Output height</label>
            <input id="outputHeight" type="number" min="8" max="4096" step="1" value="1080">
          </div>
        </div>

        <div class="control">
          <label for="pixelScale">Pixel size</label>
          <span class="value" data-value-for="pixelScale"></span>
          <input id="pixelScale" type="range" min="0" max="5" step="1" value="1">
        </div>
      </fieldset>

      <fieldset>
        <legend>Look</legend>
        <div class="control">
          <label for="bayerSize">Bayer size</label>
          <select id="bayerSize">
            <option value="2">2x2</option>
            <option value="4" selected>4x4</option>
            <option value="8">8x8</option>
            <option value="16">16x16</option>
          </select>
        </div>

        <div class="control">
          <label for="ditherStrength">Dither strength</label>
          <span class="value" data-value-for="ditherStrength"></span>
          <input id="ditherStrength" type="range" min="0" max="1" step="0.01" value="0.34">
        </div>

        <div class="control">
          <label for="posterizeLevels">Posterize levels</label>
          <span class="value" data-value-for="posterizeLevels"></span>
          <input id="posterizeLevels" type="range" min="2" max="16" step="1" value="6">
        </div>

        <div class="control">
          <label for="blackPoint">Black point</label>
          <span class="value" data-value-for="blackPoint"></span>
          <input id="blackPoint" type="range" min="0" max="0.95" step="0.01" value="0.03">
        </div>

        <div class="control">
          <label for="whitePoint">White point</label>
          <span class="value" data-value-for="whitePoint"></span>
          <input id="whitePoint" type="range" min="0.05" max="1" step="0.01" value="0.92">
        </div>

        <div class="control">
          <label for="gamma">Gamma</label>
          <span class="value" data-value-for="gamma"></span>
          <input id="gamma" type="range" min="0.2" max="3" step="0.01" value="1">
        </div>

        <div class="control">
          <label for="contrast">Contrast</label>
          <span class="value" data-value-for="contrast"></span>
          <input id="contrast" type="range" min="-1" max="1" step="0.01" value="0.18">
        </div>

        <div class="control">
          <label for="brightness">Brightness</label>
          <span class="value" data-value-for="brightness"></span>
          <input id="brightness" type="range" min="-1" max="1" step="0.01" value="0">
        </div>
      </fieldset>

    </aside>

    <main class="stage">
      <div class="toolbar">
        <div class="meta" id="meta">
          <span class="pill">No image loaded</span>
        </div>
        <div class="meta">
          <span class="pill">Canvas 2D</span>
          <span class="pill">Bayer threshold</span>
          <span class="pill">PNG export</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <div class="preview-shell">
          <div class="empty-state" id="emptyState">
            <strong>Ready for an image</strong>
            Drop or select a file to render an ordered dither.
          </div>
          <canvas id="previewCanvas" hidden></canvas>
        </div>
      </div>

      <div class="export-bar">
        <div class="status" id="status" role="status"></div>
        <div class="actions">
          <button class="primary" id="downloadPng" type="button" disabled>Download PNG</button>
          <button id="copyPng" type="button" disabled>Copy PNG</button>
          <button id="savePreset" type="button">Save JSON</button>
          <button id="loadPresetButton" type="button">Load JSON</button>
          <input id="loadPreset" class="hidden-file-input" type="file" accept="application/json,.json">
        </div>
      </div>
    </main>
  </div>

  <canvas id="sourceCanvas" class="source-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
